<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="apGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540" />
      <stop offset="50%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#00d4b2" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0a2540" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="24" fill="#ffffff"/>
  <rect x="4" y="4" width="112" height="112" rx="20" fill="url(#apGrad)"/>
  
  <!-- Stylized AP monogram and globe arcs representing international tech policy -->
  <g filter="url(#subtleShadow)">
    <!-- Globe orbit ellipse -->
    <ellipse cx="60" cy="60" rx="36" ry="16" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 4" opacity="0.45" transform="rotate(-25 60 60)"/>
    
    <!-- Letter A -->
    <path d="M 46 82 L 57 40 L 65 40 L 76 82 L 67 82 L 64 69 L 49 69 L 46 82 Z M 51.5 59.5 L 61.5 59.5 L 56.5 45.5 Z" fill="#ffffff"/>
    
    <!-- Connected Partnership Node / Network Accent -->
    <circle cx="78" cy="42" r="5" fill="#00d4b2" stroke="#ffffff" stroke-width="2"/>
    <line x1="68" y1="48" x2="75" y2="44" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  </g>
</svg>
